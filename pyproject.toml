[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "prefixscope"
version = "0.1.0"
description = "Auditable prefix-cache capacity curves with bounded rank state"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Xu Yixian"}]
dependencies = []

[project.scripts]
prefixscope = "prefixscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: CLI and trace integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/prefixscope"]
